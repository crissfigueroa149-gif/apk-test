<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrenabilidad: planificación y seguimiento</title>
<style>
:root{
  --bg:#f5f6f4;--card:#ffffff;--ink:#1c2321;--mut:#667570;--line:#e2e6e3;
  --acc:#0f766e;--acc-ink:#ffffff;--acc-soft:#dff3ef;
  --ok:#15803d;--warn:#b45309;--bad:#b91c1c;--ok-soft:#dcfce7;--warn-soft:#fef3c7;--bad-soft:#fee2e2;
  --c1:#0f766e;--c2:#c2410c;--c3:#4f46e5;--c4:#a16207;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#111514;--card:#1a1f1d;--ink:#eaf0ed;--mut:#93a39d;--line:#2a322f;
  --acc:#2dd4bf;--acc-ink:#04201c;--acc-soft:#12332e;
  --ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--ok-soft:#10301c;--warn-soft:#33270a;--bad-soft:#3a1414;
  --c1:#2dd4bf;--c2:#fb923c;--c3:#a5b4fc;--c4:#facc15}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
#app{max-width:980px;margin:0 auto;padding:0 14px 90px}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:22px}h2{font-size:18px}h3{font-size:15px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 0 8px}
.top .sub{color:var(--mut);font-size:13px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;max-width:180px;background:none;border:0;padding:10px 4px 9px;color:var(--mut);font:inherit;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}
.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 13px;border-radius:10px;cursor:pointer;line-height:1.2}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.btn.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.btn.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.ghost{border-color:transparent;background:none;color:var(--acc)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--acc-soft);color:var(--acc);font-weight:600}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.gr{background:var(--line);color:var(--mut)}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days span{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--line);color:var(--mut)}
.days span.on{background:var(--acc);color:var(--acc-ink)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:6px 0 4px;scrollbar-width:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 11px;font:inherit;color:var(--mut);cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:12px;color:var(--mut);margin:0 0 3px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.f .full{grid-column:1/-1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat .v{font-size:22px;font-weight:700;line-height:1.1}
.stat .l{font-size:12px;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:18px;font-size:14px}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 7px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--mut);font-weight:600;font-size:12px}
.scroll{overflow-x:auto}
.grid-att td,.grid-att th{text-align:center;padding:4px 2px;min-width:26px}
.grid-att td.nm,.grid-att th.nm{text-align:left;position:sticky;left:0;background:var(--card);min-width:110px;padding-left:6px;z-index:1}
.cell{width:26px;height:26px;border-radius:6px;border:1px dashed transparent;background:none;font:inherit;font-size:12px;cursor:pointer;color:var(--ink);padding:0}
.cell.plan{border-color:var(--line)}
.cell.P{background:var(--ok-soft);color:var(--ok);font-weight:700;border-color:transparent}
.cell.A{background:var(--bad-soft);color:var(--bad);font-weight:700;border-color:transparent}
.cell.dis{opacity:.3;cursor:default}
.hab td.d{padding:2px;text-align:center}
.hab .cell{width:22px;height:22px}
.hab .cell.P{background:var(--ok-soft)}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{fill:var(--mut);font-size:11px;font-family:inherit}
svg.ch .gl{stroke:var(--line);stroke-width:1}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:4px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
#overlay{position:fixed;inset:0;z-index:20;display:none;background:rgba(0,0,0,.45);overflow-y:auto}
#overlay.on{display:block}
.sheet{background:var(--bg);max-width:760px;margin:0 auto;min-height:100%;padding:0 14px 120px}
@media(min-width:800px){.sheet{margin:30px auto;min-height:0;border-radius:18px;padding-bottom:24px}}
.sheet .hd{position:sticky;top:0;background:var(--bg);padding:14px 0 8px;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:8px}
.foot{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 0;display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;z-index:3}
.ex{border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0;background:var(--card)}
.set{display:grid;grid-template-columns:34px 1fr 1fr 34px;gap:6px;align-items:center;margin:4px 0}
.set .n{font-size:12px;color:var(--mut);text-align:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;z-index:40;display:none;max-width:90vw}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;margin:6px 0}
.ptr{cursor:pointer}
.big{font-size:28px;font-weight:800}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc)}
.cur{background:var(--acc-soft)}
details summary{cursor:pointer;color:var(--acc);font-size:13px;margin:6px 0}
</style>
</head>

const COLS = ['clientes','sesiones','tests','mediciones','asistencia','metas','macros','plantillas'];

let dbh = null, mode = 'cargando', loaded = {}, chain = {};
function persistLocal(){ try{ localStorage.setItem('entrenabilidad_v1',JSON.stringify(S)); }catch(e){} }
function loadLocal(){ try{ const r=localStorage.getItem('entrenabilidad_v1'); if(r){ const o=JSON.parse(r); COLS.forEach(c=>{ S[c]=o[c]||{}; }); } }catch(e){} }
function queue(key,fn){ const p=(chain[key]||Promise.resolve()).catch(()=>{}).then(fn); chain[key]=p; return p; }
function put(col,id,obj){
  obj = clone(obj); S[col][id]=obj;
  if(dbh){ queue(col+'/'+id,()=>dbh.collection(col).doc(id).set(obj)).catch(e=>toast('No se pudo guardar ('+(e&&e.code||'error')+')')); }
  else persistLocal();
  render();
}
function del(col,id){
  delete S[col][id];
  if(dbh){ queue(col+'/'+id,()=>dbh.collection(col).doc(id).delete()).catch(e=>toast('No se pudo borrar ('+(e&&e.code||'error')+')')); }
  else persistLocal();
  render();
}
let rq=0; function scheduleRender(){ if(rq) return; rq=requestAnimationFrame(()=>{rq=0;render();}); }
async function initStore(){
  let c=null;
  try{ if(typeof claude!=='undefined' && claude.use) c = await claude.use('db'); }catch(e){ c=null; }
  if(!c){ mode='local'; loadLocal(); render(); return; }
  dbh=c; mode='nube';
  const timer=setTimeout(()=>{ if(COLS.some(k=>!loaded[k])){ ui.slow=true; render(); } },10000);
  COLS.forEach(col=>{
    dbh.collection(col).onSnapshot(snap=>{
      const o={}; snap.docs.forEach(d=>{ o[d.id]=d.data(); }); S[col]=o; loaded[col]=true;
      if(COLS.every(k=>loaded[k])){ clearTimeout(timer); ui.slow=false; }
      scheduleRender();
    },err=>{ toast('Error de lectura ('+(err&&err.code||'?')+')'); });
  });
  render();
}

function ptsFuerza(key,sexo,reps){
  const r=num(reps); if(r==null||!sexo) return null;
  const t=STR[KEYMAP[key]][sexo==='M'?'M':'F'];
  for(const c of t){ if(c.rng && r>=c.rng[0] && r<=c.rng[1]) return c; }
  return r>t[6].rng[0]?t[6]:t[0];
}
function catTotal(p){ return p<=53?'Baja':p<=65?'Regular':p<=77?'Buena':p<=89?'Muy buena':'Excelente'; }
function vo2Tabla(sexo,pulso,peso){
  const T=HARV[sexo==='M'?'M':'F']; const ps=Object.keys(T.rows).map(Number).sort((a,b)=>a-b);
  if(!ps.length||num(pulso)==null||num(peso)==null) return null;
  const p=Math.max(ps[0],Math.min(ps[ps.length-1],Math.round(pulso)));
  let row=T.rows[p]; let best=null,bd=1e9;
  T.w.forEach((w,i)=>{ if(w!=null && row[i]!=null){ const d=Math.abs(w-peso); if(d<bd){bd=d;best=row[i];} } });
  return best;
}
function factorEdad(edad){
  const a=HARV.age; if(num(edad)==null) return 1;
  if(edad<=a[0][0]) return a[0][1]; if(edad>=a[a.length-1][0]) return a[a.length-1][1];
  for(let i=0;i<a.length-1;i++){ if(edad>=a[i][0]&&edad<=a[i+1][0]){ const t=(edad-a[i][0])/(a[i+1][0]-a[i][0]); return a[i][1]+(a[i+1][1]-a[i][1])*t; } }
  return 1;
}
function catVO2(sexo,edad,v){
  if(v==null||!sexo||num(edad)==null) return null;
  const B=BANDAS[sexo==='M'?'M':'F']; const b=B.find(x=>edad<=x[0])||B[B.length-1];
  return v<b[1]?'Baja':v<=b[2]?'Regular':v<=b[3]?'Media':v<=b[4]?'Buena':'Excelente';
}
function mondayOf(s){ const d=parseD(s); const k=(d.getDay()+6)%7; d.setDate(d.getDate()-k); return ymd(d); }
function sessStats(se){
  let series=0,reps=0,ton=0;
  (se.ejercicios||[]).forEach(e=>(e.series||[]).forEach(s=>{
    const r=num(s.reps), l=num(s.lb);
    if(r>0){ series++; reps+=r; if(l>0) ton+=r*l; }
  }));
  const srpe=(num(se.duracion)||0)*(num(se.rpe)||0);
  return {series,reps,ton,srpe};
}

/* ============ Gráficos SVG ============ */
const COLORS=['var(--c1)','var(--c2)','var(--c3)','var(--c4)'];
function lineChart(series,h=170){
  const pts=series.flatMap(s=>s.pts); if(!pts.length) return '<div class="empty">Aún no hay datos para graficar</div>';
  const W=640,m={l:38,r:12,t:10,b:22};
  let x0=Math.min(...pts.map(p=>p.x)),x1=Math.max(...pts.map(p=>p.x)); if(x0===x1){x0-=2592e5;x1+=2592e5;}
  let y0=Math.min(...pts.map(p=>p.y)),y1=Math.max(...pts.map(p=>p.y)); if(y0===y1){y0-=1;y1+=1;}
  const pd=(y1-y0)*.18; y0-=pd; y1+=pd;
  const X=x=>m.l+(x-x0)/(x1-x0)*(W-m.l-m.r), Y=y=>h-m.b-(y-y0)/(y1-y0)*(h-m.t-m.b);
  let g='';
  for(let i=0;i<4;i++){ const v=y0+(y1-y0)*i/3; g+=`<line class="gl" x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${m.l-5}" y="${Y(v)+4}" text-anchor="end">${fmt(v,v>=100?0:1)}</text>`; }
  g+=`<text x="${m.l}" y="${h-5}">${fdate(ymd(new Date(x0+(x0===x1?0:0))))}</text>`;
  g+=`<text x="${W-m.r}" y="${h-5}" text-anchor="end">${fdate(ymd(new Date(x1)))}</text>`;
  series.forEach((s,i)=>{
    const c=COLORS[i%4]; const p=s.pts.slice().sort((a,b)=>a.x-b.x);
    if(p.length>1) g+=`<polyline fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round" points="${p.map(q=>X(q.x)+','+Y(q.y)).join(' ')}"/>`;
    p.forEach(q=>{ g+=`<circle cx="${X(q.x)}" cy="${Y(q.y)}" r="3.6" fill="${c}"><title>${esc(s.name)}: ${fmt(q.y)} (${fdate(ymd(new Date(q.x)))})</title></circle>`; });
  });
  const leg=series.length>1?`<div class="leg">${series.map((s,i)=>`<span><i style="background:${COLORS[i%4]}"></i>${esc(s.name)}</span>`).join('')}</div>`:'';
  return `<svg class="ch" viewBox="0 0 ${W} ${h}" role="img">${g}</svg>${leg}`;
}
function barChart(items,h=150,unit=''){
  if(!items.length||items.every(i=>!i.v)) return '<div class="empty">Aún no hay sesiones registradas</div>';
  const W=640,m={l:8,r:8,t:16,b:22}; const mx=Math.max(...items.map(i=>i.v))||1; const bw=(W-m.l-m.r)/items.length;
  let g='';
  items.forEach((it,i)=>{
    const bh=(h-m.t-m.b)*it.v/mx, x=m.l+i*bw+bw*.15, y=h-m.b-bh;
    g+=`<rect x="${x}" y="${y}" width="${bw*.7}" height="${bh}" rx="4" fill="${it.hi?'var(--c2)':'var(--c1)'}"><title>${esc(it.l)}: ${fmt(it.v,0)}${unit}</title></rect>`;
    if(it.v) g+=`<text x="${x+bw*.35}" y="${y-4}" text-anchor="middle">${fmt(it.v,0)}</text>`;
    g+=`<text x="${x+bw*.35}" y="${h-6}" text-anchor="middle">${esc(it.l)}</text>`;
  });
  return `<svg class="ch" viewBox="0 0 ${W} ${h}" role="img">${g}</svg>`;
}

function loadBlock(ses){
  const w={}; ses.forEach(s=>{ const k=mondayOf(s.fecha); const st=sessStats(s); w[k]=w[k]||{ton:0,srpe:0,n:0}; w[k].ton+=st.ton; w[k].srpe+=st.srpe; w[k].n++; });
  const items=[]; const d=parseD(mondayOf(ymd(new Date())));
  for(let i=7;i>=0;i--){ const x=new Date(d); x.setDate(x.getDate()-7*i); const k=ymd(x); items.push({l:pad(x.getDate())+'/'+pad(x.getMonth()+1),v:(w[k]||{}).srpe||0,hi:i===0}); }
  const acute=items[7].v; const prev=items.slice(3,7).map(i=>i.v); const chronic=prev.reduce((a,b)=>a+b,0)/4;
  let ratio='';
  if(chronic>0){ const r=acute/chronic; const cl=r<0.8?'warn':r<=1.3?'ok':'bad'; ratio=`<div class="row" style="margin-top:8px"><span class="chip ${cl}">Relación aguda:crónica ${fmt(r,2)}</span><span class="xs mut">${r<0.8?'Carga baja respecto al promedio: margen para progresar.':r<=1.3?'Zona recomendada (0,8 a 1,3).':'Subida brusca de carga: vigila la recuperación.'}</span></div>`; }
  return barChart(items,150,' u.a.')+ratio+'<div class="xs mut" style="margin-top:4px">Barras: carga por semana (unidades arbitrarias). La semana actual va en naranja.</div>';
}

  const CL={edad:['Edad','1'],peso:['Peso corporal (kg)','any'],talla:['Talla (cm)','any']};
  const ctx=(T.needs||[]).map(k=>k==='sexo'?`<div><label>Sexo</label><select data-b="sexo"><option value="">–</option><option value="F" ${d.sexo==='F'?'selected':''}>Mujer</option><option value="M" ${d.sexo==='M'?'selected':''}>Hombre</option></select></div>`:`<div><label>${CL[k][0]}</label><input type="number" step="${CL[k][1]}" inputmode="decimal" data-b="${k}" data-n value="${esc(d[k])}"></div>`).join('');
  const fields=(T.campos||[]).map(f=>f.t==='sel'?`<div><label>${f.l}</label><select data-b="v.${f.k}">${f.opts.map(o=>`<option ${o===d.v[f.k]?'selected':''}>${o}</option>`).join('')}</select></div>`:f.t==='txt'?`<div class="full"><label>${f.l}</label><input data-b="v.${f.k}" value="${esc(d.v[f.k])}"></div>`:`<div><label>${f.l}${f.u?' ('+f.u+')':''}</label><input type="number" step="any" inputmode="decimal" data-b="v.${f.k}" data-n value="${esc(d.v[f.k])}"></div>`).join('');
  return `<div class="sheet"><div class="hd"><div><h2>${esc(T.n)}</h2><div class="sub sm mut">${c?esc(c.nombre):''}</div></div><button class="btn" data-a="close">Cerrar</button></div>
  <details><summary>Cómo se hace</summary><div class="sm">${esc(T.proto)}</div><div class="xs mut" style="margin-top:6px">Fuente de la fórmula o norma: ${esc(T.ref)}</div></details>
  <div class="f" style="margin-top:8px"><div><label>Fecha</label><input type="date" data-b="fecha" value="${esc(d.fecha)}"></div>${ctx}${fields}</div>
  <div class="card" id="gres"></div>
  <div class="foot">${d._new?'<span></span>':confirmBtn('deltest:'+d._id,'Eliminar','deltest',d._id)}<button class="btn pri" data-a="savegtest">Guardar</button></div></div>`;
}
function renderModal(){
  const f={cliente:mCliente,med:mMed,sesion:mSesion,fuerza:mFuerza,harvard:mHarvard,gtest:mGtest}[ui.modal];
  return f?f():'';
}

/* ============ Render principal ============ */
function render(force){
  if(ui.modal && !force) return;
  const app=$('#app'); const ov=$('#overlay');
  const tabs=[['hoy','Hoy'],['clientes','Clientes'],['asistencia','Asistencia'],['tests','Tests'],['ajustes','Ajustes']];
  let v;
  if(ui.tab==='clientes') v=ui.cid?vClient():vClientes();
  else v=({hoy:vHoy,asistencia:vAsistencia,tests:vTests,ajustes:vAjustes}[ui.tab]||vHoy)();
  let banner='';
  if(mode==='local') banner=`<div class="banner">Modo local: los datos se guardan solo en este navegador. Copia un respaldo desde Ajustes.</div>`;
  if(ui.slow) banner+=`<div class="banner">No se pudo conectar con la base de datos todavía. Lo que ves puede estar desactualizado.</div>`;
  const keepScroll=window.scrollY;
  app.innerHTML=banner+v+`<nav class="nav">${tabs.map(t=>`<button class="${ui.tab===t[0]?'on':''}" data-a="tab" data-v="${t[0]}">${ICON[t[0]==='ajustes'?'ajustes':t[0]]}<span>${t[1]}</span></button>`).join('')}</nav>`;
  if(ui.modal){ ov.innerHTML=renderModal(); ov.classList.add('on'); document.body.classList.add('lock'); derive(); }
  else { ov.innerHTML=''; ov.classList.remove('on'); document.body.classList.remove('lock'); }
  if(!force) window.scrollTo(0,keepScroll);
}
function openModal(type,d){ ui.modal=type; ui.d=d; ui.confirm=null; render(true); const ov=$('#overlay'); ov.scrollTop=0; }
function closeModal(){ ui.modal=null; ui.d=null; ui.confirm=null; render(true); }

/* ============ Acciones ============ */
function newSessionDraft(cid){ return {_new:true,cid,fecha:ymd(new Date()),area:AREAS[0],duracion:'',rpe:'',notas:'',ejercicios:[]}; }
function blankEx(){ return {n:'',fase:'Parte principal',series:[{obj:'',reps:'',lb:''},{obj:'',reps:'',lb:''},{obj:'',reps:'',lb:''}],lbObj:'',rm:'',fc:'',rpe:'',desc:'',obs:''}; }
function setPath(o,path,v){ const ks=path.split('.'); let t=o; for(let i=0;i<ks.length-1;i++) t=t[ks[i]]; t[ks[ks.length-1]]=v; }
function testDraft(cid,tipo){
  const c=cli(cid); const m=lastBy(ofC('mediciones',cid));
  const base={_new:true,cid,tipo,fecha:ymd(new Date()),sexo:c.sexo||'',peso:m&&m.peso!=null?m.peso:(c.peso??'')};
  if(tipo==='fuerza') return {...base,reps:{}};
  return {...base,edad:c.edad??'',pulso:''};
}

function gDraft(cid,tipo){
  const c=cli(cid); const m=lastBy(ofC('mediciones',cid)); const T=testById(tipo); const v={};
  (T.campos||[]).forEach(f=>{ v[f.k]=f.def!==undefined?(typeof f.def==='function'?f.def(c):f.def):''; });
  return {_new:true,cid,tipo,fecha:ymd(new Date()),sexo:c.sexo||'',edad:c.edad??'',peso:m&&m.peso!=null?m.peso:(c.peso??''),talla:c.talla??'',v};
}
document.addEventListener('input',e=>{
  const el=e.target; if(el.id==='tplsel') return;
  const p=el.dataset&&el.dataset.b; if(!p||!ui.d) return;
  let v=el.value; if(el.dataset.n!==undefined) v=v===''?'':Number(String(v).replace(',','.'));
  setPath(ui.d,p,v);
  if(ui.modal==='sesion' && p==='cid'){ const t=document.querySelector('.sheet .sub'); const c=cli(v); if(t) t.textContent=c?c.nombre:''; }
  derive();
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='tplsel' && ui.modal==='sesion'){
    const p=allPlantillas().find(x=>x.id===el.value); if(!p) return;
    const exs=clone(p.ejercicios).map(x=>({...x,series:x.series.map(s=>({obj:s.obj||'',reps:'',lb:''}))}));
    ui.d.ejercicios=ui.d.ejercicios.concat(exs); ui.d.area=p.area||ui.d.area; render(true); return;
  }
  if(el.id==='tclient'){ ui.testFilter=el.value; return; }
  const a=el.dataset&&el.dataset.a2; if(!a) return;
  const id=el.dataset.id;
  if(a==='macmeta'||a==='macinicio'){ const mc=clone(S.macros[id]); if(a==='macmeta') mc.meta=el.value; else mc.inicio=el.value; put('macros',id,mc); }
  if(a==='macset'){ const mc=clone(S.macros[id]); const k=el.dataset.k; mc.semanas[+el.dataset.i][k]=k==='periodo'?el.value:Number(el.value); put('macros',id,mc); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter' && e.target.id==='newhab'){ const b=document.querySelector('[data-a="addhab"]'); if(b) b.click(); } });

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return; const a=el.dataset.a; const id=el.dataset.id; const v=el.dataset.v;
  switch(a){
    case 'tab': ui.tab=v; ui.cid=null; ui.confirm=null; render(); window.scrollTo(0,0); break;
    case 'client': ui.tab='clientes'; ui.cid=id; ui.sub='resumen'; ui.confirm=null; render(); window.scrollTo(0,0); break;
    case 'back': ui.cid=null; render(); break;
    case 'sub': ui.sub=v; ui.confirm=null; render(); break;
    case 'mes': { const [y,m]=ui.month.split('-').map(Number); const d=new Date(y,m-1+Number(v),1); ui.month=d.getFullYear()+'-'+pad(d.getMonth()+1); render(); break; }
    case 'ask': ui.confirm=el.dataset.key; render(); break;
    case 'close': closeModal(); break;
    /* clientes */
    case 'newclient': openModal('cliente',{_new:true,nombre:'',edad:'',sexo:'',peso:'',talla:'',objetivo:'',dias:[],hora:'',inicio:ymd(new Date()),clases:'',valor:'',notas:''}); break;
    case 'editclient': { const c=cli(id); openModal('cliente',{...clone(c),_id:id,dias:(c.dias||[]).slice()}); break; }
    case 'tgdia': { const ds=ui.d.dias; const i=ds.indexOf(v); if(i>=0) ds.splice(i,1); else ds.push(v); render(true); break; }
    case 'saveclient': {
      const d=clone(ui.d); if(!String(d.nombre||'').trim()){ toast('Falta el nombre'); break; }
      const cid=d._id||uid(); const prev=S.clientes[cid]||{}; delete d._new; delete d._id; d.nombre=d.nombre.trim(); d.activo=prev.activo!==false;
      d.dias=DORD.filter(l=>d.dias.includes(l));
      ui.modal=null; ui.d=null; put('clientes',cid,{...prev,...d}); render(true); toast('Cliente guardado'); break; }
    case 'archive': case 'archive_ok': if(a==='archive'){ ui.confirm='archive:'+id; render(); break; } { const c=clone(S.clientes[id]); c.activo=false; ui.cid=null; ui.confirm=null; put('clientes',id,c); toast('Cliente archivado'); break; }
    case 'unarchive': { const c=clone(S.clientes[id]); c.activo=true; put('clientes',id,c); break; }
    /* asistencia */
    case 'att': { const date=el.dataset.date; const cur=attOf(id,date); let nv; if(v==='cycle') nv=cur===''?'P':cur==='P'?'A':''; else nv=cur===v?'':v; setAtt(id,date,nv); break; }
    /* mediciones */
    case 'newmed': openModal('med',{_new:true,cid:id,fecha:ymd(new Date()),peso:'',grasaPct:'',masaGrasa:'',masaMusc:'',visceral:'',brazo:'',muslo:'',cintura:'',cadera:''}); break;
    case 'editmed': { const m=S.mediciones[id]; const d={...clone(m),_id:id}; ['peso','grasaPct','masaGrasa','masaMusc','visceral','brazo','muslo','cintura','cadera'].forEach(k=>{ if(d[k]==null) d[k]=''; }); openModal('med',d); break; }
    case 'savemed': {
      const d=clone(ui.d); const out={cid:d.cid,fecha:d.fecha||ymd(new Date())};
      ['peso','grasaPct','masaGrasa','masaMusc','visceral','brazo','muslo','cintura','cadera'].forEach(k=>{ out[k]=num(d[k]); });
      if(out.masaGrasa==null&&out.peso!=null&&out.grasaPct!=null) out.masaGrasa=Math.round(out.peso*out.grasaPct)/100;
      const mid=d._id||uid(); const c=clone(S.clientes[d.cid]); if(out.peso!=null&&(!d._id||true)){ const latest=lastBy(ofC('mediciones',d.cid).filter(x=>x.id!==mid).concat([{...out}])); if(latest&&latest.fecha===out.fecha){ c.peso=out.peso; put('clientes',d.cid,c); } }
      ui.modal=null; ui.d=null; put('mediciones',mid,out); render(true); toast('Medición guardada'); break; }
    case 'delmed': case 'delmed_ok': if(a==='delmed'){ ui.confirm='delmed:'+id; render(true); break; } ui.modal=null; ui.d=null; del('mediciones',id); render(true); break;
    /* sesiones */
    case 'newsess': { const d=newSessionDraft(id); const ls=lastBy(ofC('sesiones',id)); if(ls){ const i=AREAS.indexOf(ls.area); d.area=AREAS[(i+1)%2]||AREAS[0]; } openModal('sesion',d); break; }
    case 'editsess': { const s=S.sesiones[id]; openModal('sesion',{...clone(s),_id:id}); break; }
    case 'addex': ui.d.ejercicios.push(blankEx()); render(true); break;
    case 'delex': ui.d.ejercicios.splice(+el.dataset.i,1); render(true); break;
    case 'addset': ui.d.ejercicios[+el.dataset.i].series.push({obj:'',reps:'',lb:''}); render(true); break;
    case 'delset': ui.d.ejercicios[+el.dataset.i].series.splice(+el.dataset.j,1); render(true); break;
    case 'savesess': {
      const d=clone(ui.d); if(!d.cid){ toast('Elige un cliente'); break; }
      d.ejercicios=d.ejercicios.filter(e=>String(e.n||'').trim()); const sid=d._id||uid(); delete d._new; delete d._id;
      ui.modal=null; ui.d=null; put('sesiones',sid,d); render(true); toast('Sesión guardada'); break; }
    case 'delsess': case 'delsess_ok': if(a==='delsess'){ ui.confirm='delsess:'+id; render(true); break; } ui.modal=null; ui.d=null; del('sesiones',id); render(true); break;
    case 'savetpl': {
      const nm=prompt2(); break; }
    /* tests */
    case 'newtest': if(GENERIC(v)) openModal('gtest',gDraft(id,v)); else openModal(v,testDraft(id,v)); break;
    case 'newtest2': { if(!ui.testFilter){ toast('Elige primero un cliente (arriba)'); window.scrollTo(0,0); break; } if(GENERIC(v)) openModal('gtest',gDraft(ui.testFilter,v)); else openModal(v,testDraft(ui.testFilter,v)); break; }
    case 'edittest': { const t=S.tests[id]; const d={...clone(t),_id:id}; if(GENERIC(t.tipo)){ d.v=clone(t.v||{}); openModal('gtest',d); break; } if(t.tipo==='fuerza') d.reps=clone(t.reps||{}); openModal(t.tipo,d); break; }
    case 'savetest': {
      const d=clone(ui.d); if(!d.sexo){ toast('Elige el sexo para calcular'); break; }
      let out={cid:d.cid,tipo:d.tipo,fecha:d.fecha||ymd(new Date()),sexo:d.sexo,peso:num(d.peso)};
      if(d.tipo==='fuerza'){ const r=calcFuerza(d); if(!r.n){ toast('Ingresa al menos una repetición'); break; } out.reps=d.reps; out.res={total:r.total,cat:catTotal(r.total),completo:r.complete}; out.pts={}; EJ_FUERZA.forEach(e=>{ if(r.rows[e.k]) out.pts[e.k]=r.rows[e.k].pts; }); }
      else { const r=calcHarvard(d); if(!r){ toast('Completa peso, sexo y pulsaciones'); break; } out.edad=num(d.edad); out.pulso=num(d.pulso); out.res={vo2tabla:r.vo2tabla,factor:r.factor,vo2aj:r.vo2aj,cat:r.cat}; }
      const tid=d._id||uid(); ui.modal=null; ui.d=null; put('tests',tid,out); render(true); toast('Test guardado'); break; }
    case 'savegtest': {
      const d=clone(ui.d); const r=calcG(d); if(!r||r.valor==null){ toast('Completa los datos del test'); break; }
      const out={cid:d.cid,tipo:d.tipo,fecha:d.fecha||ymd(new Date()),sexo:d.sexo||'',edad:num(d.edad),peso:num(d.peso),talla:num(d.talla),v:d.v,res:{valor:r.valor,unidad:r.unidad||'',dec:r.dec??1,cat:r.cat||null,cc:r.cc||'',lines:r.lines||[],nota:r.nota||''}};
      const tid=d._id||uid(); ui.modal=null; ui.d=null;
      const c0=S.clientes[d.cid]; if(c0){ const c=clone(c0); let ch=false; if(!c.sexo&&d.sexo){c.sexo=d.sexo;ch=true;} if((c.edad===''||c.edad==null)&&num(d.edad)){c.edad=num(d.edad);ch=true;} if((c.talla===''||c.talla==null)&&num(d.talla)){c.talla=num(d.talla);ch=true;} if(ch) put('clientes',d.cid,c); }
      put('tests',tid,out); render(true); toast('Test guardado'); break; }
    case 'deltest': case 'deltest_ok': if(a==='deltest'){ ui.confirm='deltest:'+id; render(true); break; } ui.modal=null; ui.d=null; del('tests',id); render(true); break;
    /* macro */
    case 'macnew': put('macros',id,{cid:id,meta:MACRO_BASE.meta,inicio:ymd(new Date()),semanas:clone(MACRO_BASE.semanas)}); break;
    case 'delmac': case 'delmac_ok': if(a==='delmac'){ ui.confirm='delmac:'+id; render(); break; } ui.confirm=null; del('macros',id); break;
    /* hábitos */
    case 'hab': { const mid=id+'_'+ui.month; const d=clone(S.metas[mid]||{cid:id,mes:ui.month,habitos:HABITOS_BASE.slice(),obj:OBJ_MES_BASE.map(t=>({t,ok:null})),d:{}}); const k=el.dataset.h+'-'+el.dataset.day; const cur=d.d[k]; if(cur===undefined) d.d[k]=1; else if(cur===1) d.d[k]=0; else delete d.d[k]; put('metas',mid,d); break; }
    case 'addhab': { const inp=$('#newhab'); const t=inp&&inp.value.trim(); if(!t) break; const mid=id+'_'+ui.month; const d=clone(S.metas[mid]||{cid:id,mes:ui.month,habitos:HABITOS_BASE.slice(),obj:OBJ_MES_BASE.map(t=>({t,ok:null})),d:{}}); d.habitos.push(t); put('metas',mid,d); break; }
    case 'objm': { const mid=id+'_'+ui.month; const d=clone(S.metas[mid]||{cid:id,mes:ui.month,habitos:HABITOS_BASE.slice(),obj:OBJ_MES_BASE.map(t=>({t,ok:null})),d:{}}); const o=d.obj[+el.dataset.i]; const nv=v==='1'; o.ok=o.ok===nv?null:nv; put('metas',mid,d); break; }
    /* ajustes */
    case 'seed': seedAll(); break;
    case 'backup': { const txt=JSON.stringify(S); const done=()=>toast('Respaldo copiado'); try{ navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt)); }catch(err){ fallbackCopy(txt); } break; }
    case 'restore': { const t=$('#restore').value.trim(); if(!t){ toast('Pega primero el respaldo'); break; } try{ const o=JSON.parse(t); restoreAll(o); }catch(err){ toast('El texto no es un respaldo válido'); } break; }
    case 'wipe': case 'wipe_ok': if(a==='wipe'){ ui.confirm='wipe'; render(); break; } wipeAll(); break;
  }
});

function prompt2(){
  const d=ui.d; const exs=d.ejercicios.filter(e=>String(e.n||'').trim());
  if(!exs.length){ toast('Agrega ejercicios primero'); return; }
  const c=cli(d.cid); const id=uid();
  const nombre=(d.area||'Rutina')+' · '+(c?c.nombre:'')+' '+fdate(d.fecha);
  const p={nombre,area:d.area,ejercicios:clone(exs).map(e=>({...e,series:e.series.map(s=>({obj:s.reps!==''?String(s.reps):(s.obj||''),reps:'',lb:''}))}))};
  S.plantillas[id]=p; if(dbh) queue('plantillas/'+id,()=>dbh.collection('plantillas').doc(id).set(p)).catch(()=>toast('No se pudo guardar la plantilla')); else persistLocal();
  toast('Plantilla guardada: «'+nombre+'»');
}
function fallbackCopy(txt){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} ta.remove(); toast(ok?'Respaldo copiado':'No se pudo copiar: intenta de nuevo'); }
function seedAll(){
  const have=new Set(clientes().map(c=>(c.nombre||'').toLowerCase())); let n=0; let cristian=null;
  SEED_CLIENTES.forEach(s=>{
    if(have.has(s.nombre.toLowerCase())){ const ex=clientes().find(c=>c.nombre.toLowerCase()===s.nombre.toLowerCase()); if(s.nombre==='Cristian') cristian=ex.id; return; }
    const id=uid(); const c={nombre:s.nombre,edad:s.edad??'',sexo:s.sexo||'',peso:s.peso??'',objetivo:s.objetivo||'',dias:s.dias?s.dias.split(''):[],hora:s.hora||'',inicio:s.inicio||'',clases:s.clases??'',valor:s.valor??'',notas:'',activo:true};
    S.clientes[id]=c; if(dbh) queue('clientes/'+id,()=>dbh.collection('clientes').doc(id).set(c)); n++; if(s.nombre==='Cristian') cristian=id;
  });
  if(cristian && !ofC('mediciones',cristian).length){ const mid=uid(); const m={cid:cristian,fecha:'2025-06-11',peso:81.1,grasaPct:23.6,masaGrasa:19.1,masaMusc:35.4,visceral:null,brazo:null,muslo:null,cintura:null,cadera:null}; S.mediciones[mid]=m; if(dbh) queue('mediciones/'+mid,()=>dbh.collection('mediciones').doc(mid).set(m)); }
  if(!dbh) persistLocal(); render(); toast(n?n+' clientes cargados':'Ya estaban todos cargados');
}
function restoreAll(o){
  COLS.forEach(col=>{ const cur=Object.keys(S[col]); const nw=o[col]||{}; cur.forEach(id=>{ if(!(id in nw)) del2(col,id); }); Object.entries(nw).forEach(([id,v])=>{ S[col][id]=v; if(dbh) queue(col+'/'+id,()=>dbh.collection(col).doc(id).set(v)); }); });
  if(!dbh) persistLocal(); render(); toast('Respaldo restaurado');
}
function del2(col,id){ delete S[col][id]; if(dbh) queue(col+'/'+id,()=>dbh.collection(col).doc(id).delete()); }
function wipeAll(){ COLS.forEach(col=>Object.keys(S[col]).forEach(id=>del2(col,id))); if(!dbh) persistLocal(); ui.confirm=null; ui.cid=null; render(); toast('Datos borrados'); }

render();
initStore();
</script>
