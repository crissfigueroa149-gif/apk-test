function themeGet(){ let k=''; try{ k=localStorage.getItem('entrenabilidad_theme')||''; }catch(e){} if(!THEMES[k]){ try{ const p=((ST&&ST.alumno)||{}).perfil||{}; if(ROLE==='alumno'&&THEMES[p.tema]) return p.tema; }catch(e){} return 'neon'; } return k; }
function appBg(){ let el=document.getElementById('appbg'); if(!el){ el=document.createElement('div'); el.id='appbg'; el.setAttribute('aria-hidden','true'); document.body.insertBefore(el,document.body.firstChild); } const k=themeGet(); if(el.dataset.t===k) return; el.dataset.t=k;
  el.style.backgroundImage=k==='fuegos'?'linear-gradient(rgba(13,14,18,.72),rgba(13,14,18,.72)),url('+BGIMG+')':(THEME_CSS[k]||'none'); }
function themeSet(k){ if(!THEMES[k]) return; try{ localStorage.setItem('entrenabilidad_theme',k); }catch(e){} appBg(); }

const parseD = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };

const DN = {L:'Lunes',M:'Martes',X:'Miércoles',J:'Jueves',V:'Viernes',S:'Sábado',D:'Domingo'};

/* ============ Almacenamiento (db compartida o local) ============ */
const COLS = ['clientes','sesiones','tests','mediciones','asistencia','metas','macros','plantillas'];
const S = {}; COLS.forEach(c=>S[c]={});
let dbh = null, mode = 'cargando', loaded = {}, chain = {};
function persistLocal(){ try{ const old=localStorage.getItem('entrenabilidad_v1'); if(old) localStorage.setItem('entrenabilidad_v1_bak',old); localStorage.setItem('entrenabilidad_v1',JSON.stringify(S)); }catch(e){} if(typeof cloudSchedule==='function') cloudSchedule(); }
function loadLocal(){ for(const k of ['entrenabilidad_v1','entrenabilidad_v1_bak']){ try{ const r=localStorage.getItem(k); if(r){ const o=JSON.parse(r); COLS.forEach(c=>{ S[c]=o[c]||{}; }); return; } }catch(e){} } }
function queue(key,fn){ const p=(chain[key]||Promise.resolve()).catch(()=>{}).then(fn); chain[key]=p; return p; }
const keepSc=app=>{ const L=[...app.querySelectorAll('.scroll')].map(e=>[e.scrollLeft,e.scrollTop]); return ()=>{ const N=app.querySelectorAll('.scroll'); L.forEach((p,i)=>{ if(N[i]){ N[i].scrollLeft=p[0]; N[i].scrollTop=p[1]; } }); }; };
function put(col,id,obj){
  const prev=S[col][id]; obj = clone(obj); S[col][id]=obj; /* optimista: la pantalla cambia primero */
  if(dbh){ queue(col+'/'+id,()=>dbh.collection(col).doc(id).set(obj)).catch(e=>{ if(S[col][id]===obj){ if(prev===undefined) delete S[col][id]; else S[col][id]=prev; render(); } toast('No se pudo guardar ('+(e&&e.code||'error')+'). Se deshizo el cambio.'); }); }
  else persistLocal();
  render();
}
function del(col,id){
  delete S[col][id];
  if(dbh){ queue(col+'/'+id,()=>dbh.collection(col).doc(id).delete()).catch(e=>toast('No se pudo borrar ('+(e&&e.code||'error')+')')); }
  else persistLocal();
  render();
}
let rq=0; function scheduleRender(){ if(rq) return; rq=requestAnimationFrame(()=>{rq=0;render();}); }
async function initStore(){
  let c=null;
  try{ if(typeof claude!=='undefined' && claude.use) c = await claude.use('db'); }catch(e){ c=null; }
  if(!c){ mode='local'; loadLocal(); render(); return; }
  dbh=c; mode='nube';
  const timer=setTimeout(()=>{ if(COLS.some(k=>!loaded[k])){ ui.slow=true; render(); } },10000);
  COLS.forEach(col=>{
    dbh.collection(col).onSnapshot(snap=>{
      const o={}; snap.docs.forEach(d=>{ o[d.id]=d.data(); }); S[col]=o; loaded[col]=true;
      if(COLS.every(k=>loaded[k])){ clearTimeout(timer); ui.slow=false; }
      scheduleRender();
    },err=>{ toast('Error de lectura ('+(err&&err.code||'?')+')'); });
  });
  render();
}

/* ============ Cálculos ============ */
function ptsFuerza(key,sexo,reps){
  const r=num(reps); if(r==null||!sexo) return null;
  const t=STR[KEYMAP[key]][sexo==='M'?'M':'F'];
  for(const c of t){ if(c.rng && r>=c.rng[0] && r<=c.rng[1]) return c; }
  return r>t[6].rng[0]?t[6]:t[0];
}
function catTotal(p){ return p<=53?'Baja':p<=65?'Regular':p<=77?'Buena':p<=89?'Muy buena':'Excelente'; }
function vo2Tabla(sexo,pulso,peso){
  const T=HARV[sexo==='M'?'M':'F']; const ps=Object.keys(T.rows).map(Number).sort((a,b)=>a-b);
  if(!ps.length||num(pulso)==null||num(peso)==null) return null;
  const p=Math.max(ps[0],Math.min(ps[ps.length-1],Math.round(pulso)));
  let row=T.rows[p]; let best=null,bd=1e9;
  T.w.forEach((w,i)=>{ if(w!=null && row[i]!=null){ const d=Math.abs(w-peso); if(d<bd){bd=d;best=row[i];} } });
  return best;
}
function factorEdad(edad){
  const a=HARV.age; if(num(edad)==null) return 1;
  if(edad<=a[0][0]) return a[0][1]; if(edad>=a[a.length-1][0]) return a[a.length-1][1];
  for(let i=0;i<a.length-1;i++){ if(edad>=a[i][0]&&edad<=a[i+1][0]){ const t=(edad-a[i][0])/(a[i+1][0]-a[i][0]); return a[i][1]+(a[i+1][1]-a[i][1])*t; } }
  return 1;
}
function catVO2(sexo,edad,v){
  if(v==null||!sexo||num(edad)==null) return null;
  const B=BANDAS[sexo==='M'?'M':'F']; const b=B.find(x=>edad<=x[0])||B[B.length-1];
  return v<b[1]?'Baja':v<=b[2]?'Regular':v<=b[3]?'Media':v<=b[4]?'Buena':'Excelente';
}

function sessStats(se){

  (se.ejercicios||[]).forEach(e=>(e.series||[]).forEach(s=>{
    const r=num(s.reps), l=num(s.lb);

const testById = id => TESTS.find(t=>t.id===id);
const GENERIC = id => { const t=testById(id); return !!t && !t.special; };
function valorOf(t){ if(t.tipo==='fuerza') return t.res&&t.res.total; if(t.tipo==='harvard') return t.res&&t.res.vo2aj; return t.res&&t.res.valor; }
function testName(t){ const x=testById(t.tipo); return x?x.n:t.tipo; }
function chipCls(res){ return res.cc||CAT_COL[res.cat]||''; }
function testRes(t){
  if(t.tipo==='fuerza') return `<b>${t.res.total} pts</b> <span class="chip ${CAT_COL[t.res.cat]||''}">${esc(t.res.cat)}</span>`;
  if(t.tipo==='harvard') return `<b>${fmt(t.res.vo2aj,0)} ml/kg/min</b> ${t.res.cat?`<span class="chip ${CAT_COL[t.res.cat]||''}">${esc(t.res.cat)}</span>`:''}`;
  const r=t.res||{}; return `<b>${r.valor!=null?fmt(r.valor,r.dec??1):'–'} ${esc(r.unidad||'')}</b> ${r.cat?`<span class="chip ${chipCls(r)}">${esc(r.cat)}</span>`:''}`;
}
function lastMark(cid,tipo){ if(!cid) return ''; const l=ofC('tests',cid).filter(x=>x.tipo===tipo&&valorOf(x)!=null).sort((x,y)=>y.fecha.localeCompare(x.fecha))[0]; if(!l) return ''; const r=l.res||{}, u=l.tipo==='fuerza'?'pts':l.tipo==='harvard'?'ml/kg/min':(r.unidad||''); return `<div class="xs" style="color:#94A3B8;margin-top:2px">Último: <b>${fmt(valorOf(l),r.dec==null?1:r.dec)} ${esc(u)}</b> · ${fdate(l.fecha)}${r.cat?' · '+esc(r.cat):''}</div>`; }

const COLORS=['var(--c1)','var(--c2)','var(--c3)','var(--c4)'];
function lineChart(series,h=170){
  const pts=series.flatMap(s=>s.pts); if(!pts.length) return '<div class="empty">Aún no hay datos para graficar</div>';
  const W=640,m={l:38,r:12,t:10,b:22};
  let x0=Math.min(...pts.map(p=>p.x)),x1=Math.max(...pts.map(p=>p.x)); if(x0===x1){x0-=2592e5;x1+=2592e5;}
  let y0=Math.min(...pts.map(p=>p.y)),y1=Math.max(...pts.map(p=>p.y)); if(y0===y1){y0-=1;y1+=1;}
  const pd=(y1-y0)*.18; y0-=pd; y1+=pd;
  const X=x=>m.l+(x-x0)/(x1-x0)*(W-m.l-m.r), Y=y=>h-m.b-(y-y0)/(y1-y0)*(h-m.t-m.b);
  let g='';
  for(let i=0;i<4;i++){ const v=y0+(y1-y0)*i/3; g+=`<line class="gl" x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${m.l-5}" y="${Y(v)+4}" text-anchor="end">${fmt(v,v>=100?0:1)}</text>`; }
  g+=`<text x="${m.l}" y="${h-5}">${fdate(ymd(new Date(x0+(x0===x1?0:0))))}</text>`;
  g+=`<text x="${W-m.r}" y="${h-5}" text-anchor="end">${fdate(ymd(new Date(x1)))}</text>`;
  series.forEach((s,i)=>{
    const c=COLORS[i%4]; const p=s.pts.slice().sort((a,b)=>a.x-b.x);
    if(p.length>1) g+=`<polyline fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round" points="${p.map(q=>X(q.x)+','+Y(q.y)).join(' ')}"/>`;
    p.forEach(q=>{ g+=`<circle cx="${X(q.x)}" cy="${Y(q.y)}" r="3.6" fill="${c}"><title>${esc(s.name)}: ${fmt(q.y)} (${fdate(ymd(new Date(q.x)))})</title></circle>`; });
  });
  const leg=series.length>1?`<div class="leg">${series.map((s,i)=>`<span><i style="background:${COLORS[i%4]}"></i>${esc(s.name)}</span>`).join('')}</div>`:'';
  return `<svg class="ch" viewBox="0 0 ${W} ${h}" role="img">${g}</svg>${leg}`;
}
function barChart(items,h=150,unit=''){
  if(!items.length||items.every(i=>!i.v)) return '<div class="empty">Aún no hay sesiones registradas</div>';
  const W=640,m={l:8,r:8,t:16,b:22}; const mx=Math.max(...items.map(i=>i.v))||1; const bw=(W-m.l-m.r)/items.length;
  let g='';
  items.forEach((it,i)=>{
    const bh=(h-m.t-m.b)*it.v/mx, x=m.l+i*bw+bw*.15, y=h-m.b-bh;
    g+=`<rect x="${x}" y="${y}" width="${bw*.7}" height="${bh}" rx="4" fill="${it.hi?'var(--c2)':'var(--c1)'}"><title>${esc(it.l)}: ${fmt(it.v,0)}${unit}</title></rect>`;
    if(it.v) g+=`<text x="${x+bw*.35}" y="${y-4}" text-anchor="middle">${fmt(it.v,0)}</text>`;
    g+=`<text x="${x+bw*.35}" y="${h-6}" text-anchor="middle">${esc(it.l)}</text>`;
  });
  return `<svg class="ch" viewBox="0 0 ${W} ${h}" role="img">${g}</svg>`;
}

const LS_CLOUD='entrenabilidad_cloud';
function cloudGet(){ let c={}; try{ c=JSON.parse(localStorage.getItem(LS_CLOUD)||'{}')||{}; }catch(e){} c.sig=c.sig||{}; c.ut=c.ut||{}; c.tomb=c.tomb||{}; c.dirty=c.dirty||{}; c.lastPull=c.lastPull||0; return c; }
let CL=cloudGet(), cloudBusy=false, cloudT=0, cloudSeq=0;
function cloudSave(){ try{ localStorage.setItem(LS_CLOUD,JSON.stringify(CL)); }catch(e){} }
const hsh=s=>{ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return h+':'+s.length; };
const fbOn=()=>!!(CL.cfg&&CL.cfg.apiKey&&CL.cfg.projectId);
const fbBase=()=>`https://firestore.googleapis.com/v1/projects/${CL.cfg.projectId}/databases/(default)/documents`;
async function fbAuth(path,body){
  const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:${path}?key=${encodeURIComponent(CL.cfg.apiKey)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error((j.error&&j.error.message)||('HTTP '+r.status)); return j;
}
function fbSession(j){ const u=CL.user||{}; CL.user={email:j.email||u.email,uid:j.localId||j.user_id||u.uid,refresh:j.refreshToken||j.refresh_token||u.refresh,idToken:j.idToken||j.id_token,exp:Date.now()+(Number(j.expiresIn||j.expires_in)||3600)*1000-60000}; cloudSave(); }
async function fbToken(){
  if(!CL.user) throw new Error('NO_SESSION'); if(CL.user.idToken&&CL.user.exp>Date.now()) return CL.user.idToken;
  const r=await fetch(`https://securetoken.googleapis.com/v1/token?key=${encodeURIComponent(CL.cfg.apiKey)}`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(CL.user.refresh)});
  const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error((j.error&&j.error.message)||'TOKEN_EXPIRED'); fbSession(j); return CL.user.idToken;
}
async function fbCall(url,body){
  const tok=await fbToken(); const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({})); if(!r.ok){ const e=new Error((j.error&&(j.error.status||j.error.message))||('HTTP '+r.status)); e.code=r.status; throw e; } return j;
}
function cloudErr(e){
  const m=String((e&&e.message)||e||'');
  const T={EMAIL_EXISTS:'Ese correo ya tiene cuenta: usa «Entrar».',INVALID_LOGIN_CREDENTIALS:'Correo o clave incorrectos.',INVALID_PASSWORD:'Clave incorrecta.',EMAIL_NOT_FOUND:'No existe una cuenta con ese correo.',INVALID_EMAIL:'El correo no es válido.',OPERATION_NOT_ALLOWED:'En Firebase falta activar «Correo electrónico/contraseña» en Authentication.',TOO_MANY_ATTEMPTS_TRY_LATER:'Demasiados intentos: espera unos minutos.',PERMISSION_DENIED:'Firestore rechazó el acceso: revisa que pegaste y publicaste las reglas.',NOT_FOUND:'No encuentro la base Firestore: créala en Firebase («Firestore Database»).',TOKEN_EXPIRED:'La sesión venció: vuelve a entrar.',NO_SESSION:'Entra a tu cuenta primero.',USER_DISABLED:'La cuenta está deshabilitada.'};
  for(const k in T) if(m.includes(k)) return T[k];
  if(/WEAK_PASSWORD|at least 6/i.test(m)) return 'La clave debe tener al menos 6 caracteres.';
  if(/API key/i.test(m)) return 'La clave de API no es válida: revísala en Firebase.';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Sin conexión: se sincronizará cuando haya internet.';
  return 'No se pudo sincronizar ('+m.slice(0,80)+').';
}
/* detecta cambios locales comparando contra la última versión sincronizada */
function cloudScan(){
  const now=Date.now(); const seen=new Set();
  COLS.forEach(col=>Object.entries(S[col]||{}).forEach(([id,o])=>{ const k=col+'/'+id; seen.add(k); const h=hsh(JSON.stringify(o)); if(CL.sig[k]!==h){ CL.sig[k]=h; CL.ut[k]=now*1000+(cloudSeq++%1000); CL.dirty[k]=1; delete CL.tomb[k]; } }));
  Object.keys(CL.sig).forEach(k=>{ if(!seen.has(k)){ delete CL.sig[k]; const t=now*1000+(cloudSeq++%1000); CL.ut[k]=t; CL.tomb[k]=t; CL.dirty[k]=1; } });
}
const fbDocId=k=>k.replace('/','~');
const fbVal=f=>f==null?undefined:(f.stringValue!==undefined?f.stringValue:f.integerValue!==undefined?Number(f.integerValue):f.booleanValue);
async function cloudPull(){
  let changed=false, last=CL.lastPull||0;
  for(;;){
    const j=await fbCall(`${fbBase()}/users/${CL.user.uid}:runQuery`,{structuredQuery:{from:[{collectionId:'items'}],where:{fieldFilter:{field:{fieldPath:'u'},op:'GREATER_THAN',value:{integerValue:String(last)}}},orderBy:[{field:{fieldPath:'u'},direction:'ASCENDING'}],limit:200}});
    const docs=(Array.isArray(j)?j:[]).filter(x=>x.document).map(x=>x.document.fields||{});
    docs.forEach(f=>{
      const k=fbVal(f.k), u=fbVal(f.u), del=fbVal(f.d); if(!k||!u) return; last=Math.max(last,u);
      const [col,...r]=k.split('/'); const id=r.join('/'); if(!S[col]) return; const lu=CL.ut[k]||0;
      if(u>lu){
        if(del){ if(S[col][id]!==undefined){ delete S[col][id]; changed=true; } delete CL.sig[k]; CL.tomb[k]=u; }
        else { try{ const o=JSON.parse(fbVal(f.j)); S[col][id]=o; CL.sig[k]=hsh(JSON.stringify(o)); delete CL.tomb[k]; changed=true; }catch(e){ return; } }
        CL.ut[k]=u; delete CL.dirty[k];
      } else if(u<lu){ CL.dirty[k]=1; }
    });
    if(docs.length<200) break;
  }
  CL.lastPull=last; return changed;
}
async function cloudPush(){
  const keys=Object.keys(CL.dirty); let n=0;
  for(let i=0;i<keys.length;i+=100){
    const chunk=keys.slice(i,i+100);
    const writes=chunk.map(k=>{ const [col,...r]=k.split('/'); const id=r.join('/'); const o=(S[col]||{})[id]; const del=o===undefined;
      return {update:{name:`projects/${CL.cfg.projectId}/databases/(default)/documents/users/${CL.user.uid}/items/${fbDocId(k)}`,fields:{k:{stringValue:k},j:{stringValue:del?'{}':JSON.stringify(o)},u:{integerValue:String(CL.ut[k])},d:{booleanValue:del}}}}; });
    await fbCall(`${fbBase()}:commit`,{writes}); chunk.forEach(k=>{ delete CL.dirty[k]; }); n+=chunk.length; cloudSave();
  }
  return n;
}
async function syncNow(manual){
  if(dbh||!fbOn()||!CL.user||cloudBusy) { if(manual&&!fbOn()) toast('Primero guarda los datos de tu proyecto Firebase'); return; }
  cloudBusy=true; CL.status={t:Date.now(),state:'sync'}; if(ui.tab==='ajustes') render();
  try{
    cloudScan(); const ch=await cloudPull(); cloudScan(); const up=await cloudPush();
    if(ch){ persistLocal(); }
    CL.status={t:Date.now(),state:'ok',msg:'Sincronizado'}; CL.lastSync=Date.now(); cloudSave(); if(ch||manual) render();
    if(manual) toast(up||ch?'Datos sincronizados':'Todo estaba al día');
  }catch(e){ CL.status={t:Date.now(),state:'err',msg:cloudErr(e)}; cloudSave(); if(manual) toast(CL.status.msg); }
  finally{ cloudBusy=false; if(ui.tab==='ajustes'&&!ui.modal) render(); }
}
function cloudSchedule(){ if(dbh||!fbOn()||!CL.user) return; clearTimeout(cloudT); cloudT=setTimeout(()=>syncNow(false),4000); }
async function cloudAuth(kind){
  const em=(document.getElementById('fbem')||{}).value||'', pw=(document.getElementById('fbpw')||{}).value||'';
  if(!em.trim()) return toast('Escribe tu correo'); if(kind!=='reset'&&!pw) return toast('Escribe tu clave');
  try{
    if(kind==='reset'){ await fbAuth('sendOobCode',{requestType:'PASSWORD_RESET',email:em.trim()}); return toast('Te enviamos un correo para cambiar la clave'); }
    const j=await fbAuth(kind==='up'?'signUp':'signInWithPassword',{email:em.trim(),password:pw,returnSecureToken:true});
    if(CL.user&&CL.user.uid&&CL.user.uid!==j.localId){ CL.sig={};CL.ut={};CL.tomb={};CL.dirty={};CL.lastPull=0; }
    fbSession(j); cloudSave(); toast(kind==='up'?'Cuenta creada':'Sesión iniciada'); render(); syncNow(true);
  }catch(e){ toast(cloudErr(e)); }
}
const FB_RULES="rules_version = '2';\nservice cloud.firestore {\n  match /databases/{db}/documents {\n    function isAdmin() {\n      return request.auth != null\n        && exists(/databases/$(db)/documents/config/admin)\n        && get(/databases/$(db)/documents/config/admin).data.uid == request.auth.uid;\n    }\n    match /config/admin {\n      allow read: if request.auth != null;\n      allow create: if request.auth != null && request.resource.data.uid == request.auth.uid;\n      allow update, delete: if false;\n    }\n    match /users/{uid}/{document=**} {\n      allow read, write: if request.auth != null && request.auth.uid == uid;\n    }\n    match /students/{sid} {\n      allow get: if request.auth != null && (request.auth.uid == sid || resource.data.trainerUid == request.auth.uid);\n      allow list: if isAdmin() && resource.data.trainerUid == request.auth.uid;\n      allow create: if isAdmin() && request.resource.data.trainerUid == request.auth.uid;\n      allow update: if request.auth != null && request.resource.data.trainerUid == resource.data.trainerUid && (request.auth.uid == sid || isAdmin());\n      allow delete: if isAdmin() && resource.data.trainerUid == request.auth.uid;\n      match /data/{d} {\n        allow read: if request.auth != null && (request.auth.uid == sid\n          || get(/databases/$(db)/documents/students/$(sid)).data.trainerUid == request.auth.uid);\n        allow write: if request.auth != null && ((d == 'alumno' && request.auth.uid == sid)\n          || (d != 'alumno' && isAdmin() && get(/databases/$(db)/documents/students/$(sid)).data.trainerUid == request.auth.uid));\n      }\n    }\n  }\n}";

  else body=`<div class="row between" style="margin:6px 0"><div class="sm">Conectado como <b>${esc(u.email||'')}</b></div><span class="chip ${st.state==='err'?'bad':st.state==='sync'?'warn':'ok'}">${st.state==='err'?'Con error':st.state==='sync'?'Sincronizando…':'Al día'}</span></div><div class="xs mut">${CL.lastSync?'Última sincronización: '+new Date(CL.lastSync).toLocaleString('es-CL'):'Aún sin sincronizar'}${pend?' · '+pend+' cambios pendientes':''}</div>${st.state==='err'?`<div class="sm" style="margin-top:6px;color:var(--bad)">${esc(st.msg||'')}</div>`:''}<div class="row" style="margin-top:10px"><button class="btn pri" data-a="fbsync">Sincronizar ahora</button><button class="btn" data-a="fbout">Cerrar sesión</button></div><div class="xs mut" style="margin-top:8px">Los cambios se envían solos unos segundos después de guardarlos y cuando abres la app. Si borras algo, también se borra en tus otros teléfonos.</div>`;

}

/* ============ Guías: Borg, %RM, %FC y descansos ============ */
const BORG10=[
 [0,'Reposo','Sin esfuerzo','—'],[0.5,'Apenas perceptible','Casi nada de esfuerzo','—'],[1,'Muy suave','Calentamiento; conversas sin problema','6+'],
 [2,'Suave','Podrías seguir mucho rato','6+'],[3,'Moderado','Conversas cómodo; respiración tranquila','5-6'],[4,'Algo fuerte','Empiezas a notar el esfuerzo','4-5'],
 [5,'Fuerte','Respiración marcada; hablar cuesta un poco','4'],[6,'Fuerte +','Esfuerzo claro; quedan varias repeticiones','4'],[7,'Muy fuerte','Hablar cuesta; quedan unas 3 repeticiones','3'],
 [8,'Muy fuerte +','Muy exigente; quedan 2 repeticiones','2'],[9,'Casi máximo','Al límite; queda 1 repetición','1'],[10,'Máximo','No podrías hacer una más','0']];
const BORG20=[[6,'Ningún esfuerzo'],[7,'Extremadamente ligero'],[9,'Muy ligero'],[11,'Ligero'],[13,'Algo duro'],[15,'Duro (pesado)'],[17,'Muy duro'],[19,'Extremadamente duro'],[20,'Esfuerzo máximo']];
const borgCol=v=>v<=3?'#7cf0a0':v<=5?'#ffd23f':v<=8?'#ff9a3c':'#ff5f7e';
function borgHTML(){
  return `<div class="row between"><h3 style="margin:0 0 4px">Escala de Borg CR10 (0 a 10)</h3><button class="btn sm pri" data-a="gfull" data-v="borg">📺 Pantalla completa</button></div><div class="xs mut" style="margin-bottom:8px">Es el RPE que se anota en las sesiones. RIR = repeticiones que quedan en reserva.</div>
  <table><tr><th>RPE</th><th>Sensación</th><th>RIR</th></tr>${BORG10.map(b=>`<tr><td><b style="color:${borgCol(b[0])}">${String(b[0]).replace('.',',')}</b></td><td><b>${b[1]}</b><div class="xs mut">${b[2]}</div></td><td>${b[3]}</td></tr>`).join('')}</table>
  <h3 style="margin:14px 0 4px">Escala de Borg 6 a 20</h3><div class="xs mut" style="margin-bottom:6px">Para cardio: el número × 10 se parece a la frecuencia cardíaca (15 ≈ 150 lpm).</div>
  <table><tr><th>Valor</th><th>Percepción</th><th>FC aprox.</th></tr>${BORG20.map(b=>`<tr><td><b>${b[0]}</b></td><td>${b[1]}</td><td>${b[0]*10} lpm</td></tr>`).join('')}</table>
  <div class="xs mut" style="margin-top:8px">Carga interna de la sesión = duración (min) × RPE.</div>`;
}
function rirOf(v){ const n=Number(v); if(isNaN(n)) return ''; if(n>=10) return '0 RIR (al fallo)'; if(n>=9) return '≈1 RIR'; if(n>=8) return '≈2 RIR'; if(n>=7) return '≈3 RIR'; if(n>=6) return '≈4 RIR'; if(n>=5) return '≈4-5 RIR'; return 'muy ligero'; }
function borgName(v){ const n=Number(v); if(isNaN(n)) return ''; const b=BORG10.filter(x=>x[0]<=n).pop(); return b?b[1]:''; }

/* ---- %RM ---- */
const RM_ROWS=[[100,'1'],[95,'2'],[90,'4'],[85,'6'],[80,'8'],[75,'10'],[70,'12'],[65,'15'],[60,'20'],[55,'20+'],[50,'25+']];
const rmGoal=p=>p>=85?['Fuerza máxima','#ff9a3c']:p>=67?['Hipertrofia','#ffd23f']:['Resistencia muscular','#2ee6c5'];
function rmCalc(){
  const g=id=>{ const e=document.getElementById(id); return e?e.value:''; };
  const w=num(g('rm_w')), r=num(g('rm_r')), k1=num(g('rm_1')), un=g('rm_u')||'kg'; let rm=null, nota='';
  if(k1){ rm=k1; nota='1RM ingresado.'; }
  else if(w&&r){ if(r===1) rm=w; else { const ep=w*(1+r/30), br=r<37?w*36/(37-r):ep; rm=(ep+br)/2; nota=`Promedio de Epley (${fmt(ep,0)}) y Brzycki (${fmt(br,0)}). ${r>10?'Con más de 10 repeticiones la estimación es menos exacta.':''}`; } }
  const out=document.getElementById('rm_out'); if(!out) return;
  if(!rm){ out.innerHTML='<div class="empty">Ingresa el peso y las repeticiones, o tu 1RM.</div>'; return; }
  out.innerHTML=`<div class="row between" style="margin:8px 0"><div><div class="xs mut">1RM estimado</div><div class="big" style="font-size:30px;font-weight:800">${fmt(rm,0)} <span class="sm mut">${un}</span></div></div><div class="xs mut" style="max-width:55%">${nota}</div></div>
  <table><tr><th>% RM</th><th>Carga</th><th>Reps máx.</th><th>Objetivo</th></tr>${RM_ROWS.map(([p,rp])=>{ const [gl,gc]=rmGoal(p); return `<tr><td><b>${p}%</b></td><td><b>${fmt(rm*p/100,0)}</b> ${un}</td><td>${rp}</td><td><span style="color:${gc}">●</span> ${gl}</td></tr>`; }).join('')}</table>
  <div class="xs mut" style="margin-top:8px">Referencia NSCA/ACE: fuerza ≥85% (hasta 6 reps), hipertrofia 67-85% (6-12 reps), resistencia ≤67% (12 o más). Potencia: 75-90% con pocas repeticiones explosivas (o 30-60% a máxima velocidad). Las repeticiones son aproximadas y varían entre personas y ejercicios.</div>`;
}
/* ---- %FC ---- */
const FC_Z=[['Z1','50-60%',.5,.6,'Recuperación / muy ligera','2-3'],['Z2','60-70%',.6,.7,'Base aeróbica (quema de grasa)','3-5'],['Z3','70-80%',.7,.8,'Aeróbica: mejora la resistencia','5-6'],['Z4','80-90%',.8,.9,'Umbral: alta intensidad','7-8'],['Z5','90-100%',.9,1,'Máxima / anaeróbica','9-10']];
function fcCalc(){
  const g=id=>{ const e=document.getElementById(id); return e?e.value:''; };
  const ed=num(g('fc_e')), rep=num(g('fc_r')), mx=num(g('fc_m')), act=num(g('fc_a')); const out=document.getElementById('fc_out'); if(!out) return;
  if(!ed&&!mx){ out.innerHTML='<div class="empty">Ingresa la edad (o la FC máxima medida).</div>'; return; }
  const tan=ed?Math.round(208-0.7*ed):null, cla=ed?220-ed:null, fm=mx||tan;
  const zl=FC_Z.map(z=>`<tr><td><b>${z[0]}</b> ${z[1]}</td><td><b>${Math.round(fm*z[2])}-${Math.round(fm*z[3])}</b></td><td>${rep?Math.round(rep+z[2]*(fm-rep))+'-'+Math.round(rep+z[3]*(fm-rep)):'–'}</td><td>${z[4]}<div class="xs mut">Borg ${z[5]}</div></td></tr>`).join('');
  let ac=''; if(act&&fm){ const p=Math.round(100*act/fm); const z=FC_Z.find(z=>p/100<=z[3])||FC_Z[4]; ac=`<div class="card" style="margin:8px 0"><b>${act} lpm</b> = <b>${p}%</b> de la FC máx. · zona <b>${z[0]}</b> (${z[4]})${rep?` · ${Math.round(100*(act-rep)/(fm-rep))}% de la reserva`:''}</div>`; }
  out.innerHTML=`<div class="row between" style="margin:8px 0"><div><div class="xs mut">FC máxima ${mx?'(medida)':'(Tanaka)'}</div><div style="font-size:30px;font-weight:800">${fm} <span class="sm mut">lpm</span></div></div><div class="xs mut" style="max-width:55%">${mx?'':`Fórmula de Tanaka: 208 − 0,7 × edad. La clásica (220 − edad) da ${cla}. `}Es una estimación: puede variar ±10 lpm.</div></div>${ac}
  <table><tr><th>Zona</th><th>% FC máx</th><th>Karvonen</th><th>Para qué sirve</th></tr>${zl}</table>
  <div class="xs mut" style="margin-top:8px">«% FC máx» = porcentaje directo de la FC máxima. «Karvonen» usa la reserva (FC máx − FC de reposo) y necesita la FC en reposo.</div>`;
}
/* ---- descansos ---- */
const REST_SETS=[['Fuerza máxima','1-6 reps, ≥85% RM','3-5 min','#ff9a3c'],['Potencia','Explosivo, pocas reps','3-5 min','#ff5fa2'],['Hipertrofia','6-12 reps, 67-85% RM','1-2 min (30-90 s en aislados)','#ffd23f'],['Resistencia muscular','≥12 reps, ≤67% RM','30-60 s (hasta 90 s)','#2ee6c5'],['Circuito','Estaciones seguidas','15-30 s entre estaciones y 1-2 min entre vueltas','#3fa9ff']];
const REST_TYPES=[
 ['Pasivo','Sin moverte (de pie o sentado). Es el descanso normal entre series pesadas: permite recuperar la fuerza para la serie siguiente.'],
 ['Activo','Movimiento suave a baja intensidad (caminar, movilidad, bici suave; esfuerzo Borg 2-3). Ayuda a bajar el pulso entre intervalos y a recuperar entre sesiones.'],
 ['Intra-serie (cluster)','Pausas de 10-30 s dentro de una misma serie (rest-pause o cluster) para sostener más carga o velocidad. Útil en potencia y fuerza.'],
 ['Entre ejercicios','1-3 min al cambiar de ejercicio. Más corto si trabajan músculos distintos (biserie, circuito); más largo si son pesados y del mismo grupo.'],
 ['Entre sesiones','El mismo grupo muscular: 24-48 h en trabajo de hipertrofia o ligero; 48-72 h tras fuerza máxima o mucho volumen.'],
 ['Día de descanso activo','Un día a la semana con caminata de 20-30 min y movilidad, sin entrenar fuerza. Mantiene el movimiento sin sumar fatiga.'],
 ['Descanso total','Un día completo sin entrenar cuando hay fatiga acumulada, dolor que no cede o mal sueño.'],
 ['Semana de descarga','Cada 4-8 semanas: reducir el volumen cerca de 40-50% y mantener la técnica. Antes de iniciar un nuevo bloque.'],
 ['Sueño','7-9 horas por noche: es el descanso que más rinde para recuperar y ganar fuerza.']];
const REST_INT=[['Sprints y potencia (sistema de fosfágenos)','trabajo 5-10 s','pausa 1:12 a 1:20 (1-2 min)'],['Intervalos intensos (glucolítico)','trabajo 30 s a 2 min','pausa 1:3 a 1:5'],['Aeróbico por intervalos','trabajo 3-5 min','pausa 1:1 a 1:2'],['HIIT corto','trabajo 20-40 s','pausa 1:1 (20-40 s)']];
/* temporizador de descanso (pastilla flotante) */
const REST={end:0,total:0,t:0};
function restParse(s){ s=String(s||'').toLowerCase().replace(',','.'); const m=s.match(/(\d+(\.\d+)?)/); if(!m) return 0; const n=Number(m[1]); if(/min/.test(s)) return Math.round(n*60); if(/(^|\s)s(eg)?\b/.test(s)||/seg/.test(s)) return Math.round(n); return n<=5?Math.round(n*60):Math.round(n); }
function restBeep(){ try{ const A=window.AudioContext||window.webkitAudioContext; const c=new A(); [0,.28,.56].forEach(t=>{ const o=c.createOscillator(),g=c.createGain(); o.frequency.value=880; g.gain.value=.25; o.connect(g); g.connect(c.destination); o.start(c.currentTime+t); o.stop(c.currentTime+t+.18); }); }catch(e){} try{ navigator.vibrate&&navigator.vibrate([300,150,300,150,300]); }catch(e){} }
function restTick(){
  const el=document.getElementById('rtpill'); if(!el) return; const left=Math.max(0,Math.ceil((REST.end-Date.now())/1000));
  if(left>0){ el.style.display='flex'; el.innerHTML=`<b>⏱ ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</b><span class="xs">descanso · toca para parar</span><i style="width:${100*left/REST.total}%"></i>`; }
  else { clearInterval(REST.t); REST.t=0; el.innerHTML='<b>¡Listo! A la siguiente serie</b>'; restBeep(); setTimeout(()=>{ if(!REST.t) el.style.display='none'; },4000); }
}
function restStart(sec){ if(!sec) return toast('Escribe un descanso (ej. 90 s o 2 min)'); REST.total=sec; REST.end=Date.now()+sec*1000; clearInterval(REST.t); restTick(); REST.t=setInterval(restTick,250); }
function restStop(){ clearInterval(REST.t); REST.t=0; const el=document.getElementById('rtpill'); if(el) el.style.display='none'; }

/* sugerencias dentro de cada ejercicio de la sesión */
function exLive(i){
  const d=ui.d; if(!d||!d.ejercicios||!d.ejercicios[i]) return ''; const e=d.ejercicios[i], out=[];
  if(String(e.rpe||'').trim()){ const n=parseFloat(String(e.rpe).replace(',','.')); if(!isNaN(n)) out.push(`RPE ${String(e.rpe)}: ${borgName(n)} (${rirOf(n)})`); }
  const pr=parseFloat(String(e.rm||'').replace(',','.')); if(!isNaN(pr)&&d.cid){ const o=exHist(d.cid,d._id)[exNorm(e.n)]; if(o){ const m=Math.max(...o.pts.map(p=>p.rm||0)); if(m) out.push(`${pr}% RM ≈ ${Math.round(m*pr/100)} lb (1RM est. ${Math.round(m)} lb)`); } }
  const pf=String(e.fc||'').match(/(\d+)(?:\s*[-–a]\s*(\d+))?/); const c=d.cid&&cli(d.cid); if(pf&&c&&num(c.edad)){ const fm=208-0.7*num(c.edad), a=Number(pf[1]), b=pf[2]?Number(pf[2]):a; out.push(`FC ≈ ${Math.round(fm*a/100)}${b!==a?'-'+Math.round(fm*b/100):''} lpm`); }
  const s=restParse(e.desc); if(s) out.push(`Descanso ${s>=120?Math.round(s/6)/10+' min':s+' s'}`);
  return out.join(' · ');
}
document.addEventListener('input',e=>{ const p=e.target&&e.target.dataset&&e.target.dataset.b; const m=p&&p.match(/^ejercicios\.(\d+)\.(rpe|rm|fc|desc|n)$/); if(m) setTimeout(()=>{ const h=document.getElementById('xh-'+m[1]); if(h) h.textContent=exLive(Number(m[1])); },0); });

function gifUrl(u){ u=String(u||'').trim(); if(!/^https:\/\//i.test(u)) return ''; let m=/giphy\.com\/(?:gifs|embed|stickers)\/(?:[^\/?#]*-)?([A-Za-z0-9]+)(?:[\/?#]|$)/.exec(u); if(m) return 'https://media.giphy.com/media/'+m[1]+'/giphy.gif'; if(/media\d*\.giphy\.com\/media\//.test(u)||/\.(gif|webp|png|jpe?g)(\?.*)?$/i.test(u)||/media\.tenor\.com\//.test(u)) return u; return ''; }
function gifList(txt){ return String(txt||'').split(/\s+/).map(gifUrl).filter(Boolean); }
function gifPick(arr,seed){ return arr&&arr.length?arr[Math.abs(seed|0)%arr.length]:''; }
const gifImg=u=>u?`<img class="mgif" loading="lazy" referrerpolicy="no-referrer" alt="GIF" src="${esc(u)}" onerror="this.style.display='none'">`:'';

const UL=()=>(ROLE==='alumno'&&(function(){ try{ return localStorage.getItem('entrenabilidad_u'); }catch(e){ return ''; } })()==='lb')?'lb':'kg';
const wcv=x=>UL()==='lb'?Math.round((x||0)*22.0462)/10:(x||0);
const wback=x=>UL()==='lb'?Math.round((x||0)/2.20462*100)/100:(x||0);
const convR=s=>UL()==='lb'?String(s).replace(/\d+([.,]\d+)?/g,m=>wcv(Number(m.replace(',','.')))):String(s);
const hDone=H=>Object.entries(H).filter(([k,v])=>!v.x).map(([k,v])=>[k,(UL()==='lb'&&v.sets)?{...v,sets:v.sets.map(s=>({...s,l:wcv(s.l)}))}:v]);
function allRut(cid){ const a=appOf(S.clientes[cid]); const oc=a.ocultas||[]; return [...(a.rutinas||[]).map((r,i)=>({...r,mi:i})),...sesRut(cid).rutinas.filter(r=>!oc.includes(r.id))]; }
function nSer(e){ const s=String(e.s||''); const m=s.match(/^(\d+)\s*[×x]/); if(m) return Math.min(10,Number(m[1])); const p=s.split('·').filter(x=>x.trim()).length; return Math.min(10,p||3); }
const e1=s=>(s&&s.r&&s.l)?s.l*(1+s.r/30):(s&&s.l)||0;
function setsTxt(v){ return (v.sets||[]).map(s=>s.t?s.t+' s':(s.r?s.r:'?')+(s.l?'×'+s.l+UL():'')).join(' · '); }
function bestOf(H,n,skip){ let b=0; hDone(H).forEach(([k,v])=>{ if(k===skip||String(v.n).toLowerCase()!==String(n).toLowerCase()) return; (v.sets||[]).forEach(s=>{ b=Math.max(b,e1(s)); }); }); return b; }
function lastSets(H,n){ let L=null; hDone(H).forEach(([k,v])=>{ if(String(v.n).toLowerCase()===String(n).toLowerCase()&&(v.sets||[]).length&&(!L||v.t>L.t)) L=v; }); return L; }
function recordsList(H){ const m={}; hDone(H).forEach(([k,v])=>{ (v.sets||[]).forEach(s=>{ const x=e1(s); if(!x) return; const o=m[v.n.toLowerCase()]=m[v.n.toLowerCase()]||{n:v.n,b:0,l:0,d:''}; if(x>o.b){ o.b=x; o.l=s.l||0; o.r=s.r||0; o.d=v.d; } }); }); return Object.values(m).sort((x,y)=>y.d.localeCompare(x.d)).slice(0,6); }
function volMes(H){ const mk=ymd(new Date()).slice(0,7); let t=0; hDone(H).forEach(([k,v])=>{ if(String(v.d).slice(0,7)===mk) (v.sets||[]).forEach(s=>{ t+=(s.r||0)*(s.l||0); }); }); return t; }
function rachaInfo(P,AL){ const wk=(P.prog||{}).wk||{}, H=mergeH(P.hechos,AL.hechos); const cnt={}; Object.entries(wk).forEach(([k,v])=>{ cnt[k]=(cnt[k]||0)+v; });
  const hd={}; hDone(H).forEach(([k,v])=>{ const w=wkKey(parseD(v.d)); (hd[w]=hd[w]||new Set()).add(v.d); }); Object.entries(hd).forEach(([k,s])=>{ cnt[k]=Math.max(cnt[k]||0,s.size); });
  ((P.prog||{}).sd||[]).forEach(d=>{ const w=wkKey(parseD(d)); (hd[w]=hd[w]||new Set()).add(d); cnt[w]=Math.max(cnt[w]||0,hd[w].size); }); Object.keys(AL.asis||{}).forEach(d=>{ const w=wkKey(parseD(d)); (hd[w]=hd[w]||new Set()).add(d); cnt[w]=Math.max(cnt[w]||0,hd[w].size); });
  const hb=new Set(); Object.keys(AL.comidas||{}).forEach(d=>{ const c=AL.comidas[d]||{}; if(MEALS.every(m=>c[m[0]])&&((AL.agua||{})[d]||0)>=8){ const w=wkKey(parseD(d)); if(!hb.has(w)){ hb.add(w); cnt[w]=(cnt[w]||0)+1; } } });
  const meta=Math.max(1,Math.min(5,((P.sch||{}).d||[]).length||2)); let d=new Date(), n=0, first=true; const cur=cnt[wkKey(d)]||0; for(let i=0;i<60;i++){ const k=wkKey(d); if((cnt[k]||0)>=meta) n++; else if(!first) break; first=false; d=new Date(d.getFullYear(),d.getMonth(),d.getDate()-7); }
  let best=0,run=0; d=new Date(); for(let i=59;i>=0;i--){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()-7*i); if((cnt[wkKey(x)]||0)>=meta){ run++; best=Math.max(best,run); } else run=0; }

function radarChart(labels,vals){

  labels.forEach((l,i)=>{ const a=P(i,1),b=P(i,1.2); g+=`<line x1="${cx}" y1="${cy}" x2="${a[0]}" y2="${a[1]}" stroke="var(--line)"/><text x="${b[0]}" y="${b[1]+4}" text-anchor="${Math.abs(b[0]-cx)<8?'middle':b[0]>cx?'start':'end'}" style="font-size:11px">${esc(l)}</text>`; });

function loadBlock(ses){

function attStats(c,mes,hoy){
  const doc=attDoc(c.id,mes), n=diasMes(mes), [y,m]=mes.split('-').map(Number);
  let p=0,f=0,pend=0,prog=0;
  for(let i=1;i<=n;i++){ const ds=mes+'-'+pad(i); const v=(doc.d||{})[ds]||''; const dd=new Date(y,m-1,i);
    const plan=(c.dias||[]).includes(DL[dd.getDay()])&&(!c.inicio||ds>=c.inicio);
    if(v==='P')p++; else if(v==='A')f++; else if(plan&&ds<=hoy) pend++; if(plan) prog++; }
  return {p,f,pend,prog,pct:(p+f)?Math.round(100*p/(p+f)):null};
}
function attRacha(cid){ /* faltas seguidas al final y última asistencia */
  const all=[]; Object.values(S.asistencia).forEach(a=>{ if(a.cid===cid) Object.entries(a.d||{}).forEach(([d,v])=>{ if(v) all.push([d,v]); }); });

  const ult=all.filter(x=>x[1]==='P').pop(); return {faltas:f,ultima:ult?ult[0]:null};
}

  const st={}; cs.forEach(c=>{ st[c.id]=attStats(c,ui.month,hoy); });

function heroShow(){ const h=document.querySelector('.hero'); if(!h) return; const i=ui.hero%HEROS.length; const v=h.querySelector('video'); v.src=HEROS[i]; v.muted=true; ui.heroT=Date.now(); const pr=v.play(); if(pr&&pr.catch) pr.catch(()=>{}); h.querySelectorAll('.dots i').forEach((d,j)=>d.classList.toggle('on',j===i)); }
/* cada clip se repite hasta cumplir ~6 s y luego pasa al siguiente */
document.addEventListener('ended',e=>{ const v=e.target; if(!v||v.tagName!=='VIDEO'||!v.closest('.hero')) return; if(Date.now()-(ui.heroT||0)<6000){ v.currentTime=0; v.play().catch(()=>{}); } else { ui.hero=(ui.hero+1)%HEROS.length; heroShow(); } },true);
document.addEventListener('pointerdown',()=>{ const v=document.querySelector('.hero video'); if(v&&v.paused) v.play().catch(()=>{}); },{once:true,capture:true});
document.addEventListener('visibilitychange',()=>{ const v=document.querySelector('.hero video'); if(v&&!document.hidden) v.play().catch(()=>{}); });
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return; const a=el.dataset.a; const id=el.dataset.id; const v=el.dataset.v;
  switch(a){
    case 'gsub': ui.gsub=v; render(); break;
    case 'reststart': restStart(Number(v)); break;
    case 'restcustom': restStart(restParse((document.getElementById('rest_c')||{}).value+' s')); break;
    case 'reststop': restStop(); break;
    case 'exrest': { const i=Number(el.dataset.i); const s2=restParse(ui.d&&ui.d.ejercicios[i]&&ui.d.ejercicios[i].desc)||90; restStart(s2); break; }
    case 'qguide': ui.qg=!ui.qg; render(true); break;
    case 'tab': ui.tab=v; ui.cid=null; ui.confirm=null; render(); window.scrollTo(0,0); break;
    case 'client': ui.tab='clientes'; ui.cid=id; ui.sub='resumen'; ui.confirm=null; render(); window.scrollTo(0,0); break;
    case 'back': ui.cid=null; render(); break;
    case 'sub': ui.sub=v; ui.confirm=null; render(); if(v==='app'&&ui.cid) xPull(ui.cid); break;
    case 'mes': { const [y,m]=ui.month.split('-').map(Number); const d=new Date(y,m-1+Number(v),1); ui.month=d.getFullYear()+'-'+pad(d.getMonth()+1); render(); break; }
    case 'ask': ui.confirm=el.dataset.key; render(); break;
    
    case 'exdemo': { let k=el.dataset.k; if(!k){ const inp=el.closest('.ex')&&el.closest('.ex').querySelector('input[data-b$=".n"]'); k=exKey(inp?inp.value:el.dataset.n); }
      if(!k||!EXA[k]) break; const ov=document.getElementById('exov'); ov.innerHTML=`<div class="exbox" data-a="exclose"><h3 style="margin:0 0 6px">${esc(EXA[k].n)}</h3>${exAnimK(k,{size:240})}${EXA[k].mus?`<div class="sm" style="margin-top:8px"><span style="color:#dc2626">●</span> <b>Músculo principal:</b> ${esc(EXA[k].mus)}</div>`:''}<div class="sm" style="margin-top:6px">${esc(EXA[k].tip)}</div><div class="xs mut" style="margin-top:8px">Toca para cerrar</div></div>`; ov.style.display='flex'; break; }
    case 'exclose': { const ov=document.getElementById('exov'); ov.style.display='none'; ov.innerHTML=''; break; }
    case 'close': closeModal(); break;
    /* clientes */
    case 'newclient': openModal('cliente',{_new:true,nombre:'',edad:'',sexo:'',peso:'',talla:'',objetivo:'',dias:[],hora:'',inicio:ymd(new Date()),clases:'',valor:'',notas:''}); break;
    case 'editclient': { const c=cli(id); openModal('cliente',{...clone(c),_id:id,dias:(c.dias||[]).slice()}); break; }
    case 'tgdia': { const ds=ui.d.dias; const i=ds.indexOf(v); if(i>=0) ds.splice(i,1); else ds.push(v); render(true); break; }
    case 'saveclient': {
      const d=clone(ui.d); if(!String(d.nombre||'').trim()){ toast('Falta el nombre'); break; }
      const cid=d._id||uid(); const prev=S.clientes[cid]||{}; delete d._new; delete d._id; d.nombre=d.nombre.trim(); d.activo=prev.activo!==false;
      d.dias=DORD.filter(l=>d.dias.includes(l));
      ui.modal=null; ui.d=null; put('clientes',cid,{...prev,...d}); render(true); toast('Cliente guardado'); break; }
    case 'archive': case 'archive_ok': if(a==='archive'){ ui.confirm='archive:'+id; render(); break; } { const c=clone(S.clientes[id]); c.activo=false; ui.cid=null; ui.confirm=null; put('clientes',id,c); toast('Cliente archivado'); break; }
    case 'deldata_ok': { const [,what,cid]=(el.dataset.key||'').split(':'); delData(cid,what); ui.confirm=null; render(); toast((DATA_LBL[what]||'Datos')+' borrados'); break; }
    case 'delclient_ok': { const cid=id; const nm=(S.clientes[cid]||{}).nombre||'Cliente'; delData(cid,'todo'); ui.confirm=null; if(ui.cid===cid) ui.cid=null; render(true); toast(nm+' eliminado'); break; }
    case 'wipedata_ok': wipeRecords(); ui.confirm=null; render(); toast('Registros borrados'); break;
    case 'unarchive': { const c=clone(S.clientes[id]); c.activo=true; put('clientes',id,c); break; }
    /* asistencia */
    case 'attall': { const hoy=ymd(new Date()); const dh=new Date(hoy+'T12:00:00'); activos().filter(c=>(c.dias||[]).includes(DL[dh.getDay()])&&(!c.inicio||hoy>=c.inicio)&&!attOf(c.id,hoy)).forEach(c=>setAtt(c.id,hoy,'P')); break; }
    case 'att': { const date=el.dataset.date; const cur=attOf(id,date); let nv; if(v==='cycle') nv=cur===''?'P':cur==='P'?'A':''; else nv=cur===v?'':v; setAtt(id,date,nv); break; }
    /* mediciones */
    case 'newmed': openModal('med',{_new:true,cid:id,fecha:ymd(new Date()),peso:'',grasaPct:'',masaGrasa:'',masaMusc:'',visceral:'',brazo:'',muslo:'',cintura:'',cadera:''}); break;
    case 'editmed': { const m=S.mediciones[id]; const d={...clone(m),_id:id}; ['peso','grasaPct','masaGrasa','masaMusc','visceral','brazo','muslo','cintura','cadera'].forEach(k=>{ if(d[k]==null) d[k]=''; }); openModal('med',d); break; }
    case 'savemed': {
      const d=clone(ui.d); const out={cid:d.cid,fecha:d.fecha||ymd(new Date())};
      ['peso','grasaPct','masaGrasa','masaMusc','visceral','brazo','muslo','cintura','cadera'].forEach(k=>{ out[k]=num(d[k]); });
      if(out.masaGrasa==null&&out.peso!=null&&out.grasaPct!=null) out.masaGrasa=Math.round(out.peso*out.grasaPct)/100;
      const mid=d._id||uid(); const c=clone(S.clientes[d.cid]); if(out.peso!=null&&(!d._id||true)){ const latest=lastBy(ofC('mediciones',d.cid).filter(x=>x.id!==mid).concat([{...out}])); if(latest&&latest.fecha===out.fecha){ c.peso=out.peso; put('clientes',d.cid,c); } }
      ui.modal=null; ui.d=null; put('mediciones',mid,out); render(true); toast('Medición guardada'); break; }
    case 'delmed': case 'delmed_ok': if(a==='delmed'){ ui.confirm='delmed:'+id; render(true); break; } ui.modal=null; ui.d=null; del('mediciones',id); render(true); break;
    /* sesiones */
    case 'newsess': { const d=newSessionDraft(id); const ls=lastBy(ofC('sesiones',id)); if(ls){ const i=AREAS.indexOf(ls.area); d.area=AREAS[(i+1)%2]||AREAS[0]; } openModal('sesion',d); break; }
    case 'editsess': { const s=S.sesiones[id]; openModal('sesion',{...clone(s),_id:id}); break; }
    case 'addex': ui.d.ejercicios.push(blankEx()); render(true); break;
    case 'delex': ui.d.ejercicios.splice(+el.dataset.i,1); render(true); break;
    case 'addset': ui.d.ejercicios[+el.dataset.i].series.push({obj:'',reps:'',lb:''}); render(true); break;
    case 'delset': ui.d.ejercicios[+el.dataset.i].series.splice(+el.dataset.j,1); render(true); break;
    case 'savesess': {
      const d=clone(ui.d); if(!d.cid){ toast('Elige un cliente'); break; }
      d.ejercicios=d.ejercicios.filter(e=>String(e.n||'').trim()); const sid=d._id||uid(); delete d._new; delete d._id;
      ui.modal=null; ui.d=null; put('sesiones',sid,d); render(true); toast('Sesión guardada'); break; }
    case 'sesask': ui.sdel=id; render(true); break;
    case 'sesno': ui.sdel=null; render(true); break;
    case 'sesdel': ui.sdel=null; del('sesiones',id); render(true); break;
    case 'delsess': case 'delsess_ok': if(a==='delsess'){ ui.confirm='delsess:'+id; render(true); break; } ui.modal=null; ui.d=null; del('sesiones',id); render(true); break;
    case 'savetpl': {
      const nm=prompt2(); break; }
    /* tests */
    case 'newtest': if(GENERIC(v)) openModal('gtest',gDraft(id,v)); else openModal(v,testDraft(id,v)); break;
    case 'newtest2': { if(!ui.testFilter){ toast('Elige primero un cliente (arriba)'); window.scrollTo(0,0); break; } if(GENERIC(v)) openModal('gtest',gDraft(ui.testFilter,v)); else openModal(v,testDraft(ui.testFilter,v)); break; }
    case 'edittest': { const t=S.tests[id]; const d={...clone(t),_id:id}; if(GENERIC(t.tipo)){ d.v=clone(t.v||{}); d.modo=t.modo||(Object.keys(d.v).some(k=>/^pl_/.test(k))?'isak':'rapida'); openModal('gtest',d); break; } if(t.tipo==='fuerza') d.reps=clone(t.reps||{}); openModal(t.tipo,d); break; }
    case 'savetest': {
      const d=clone(ui.d); if(!d.sexo){ toast('Elige el sexo para calcular'); break; }
      let out={cid:d.cid,tipo:d.tipo,fecha:d.fecha||ymd(new Date()),sexo:d.sexo,peso:num(d.peso)};
      if(d.tipo==='fuerza'){ const r=calcFuerza(d); if(!r.n){ toast('Ingresa al menos una repetición'); break; } out.reps=d.reps; out.res={total:r.total,cat:catTotal(r.total),completo:r.complete}; out.pts={}; EJ_FUERZA.forEach(e=>{ if(r.rows[e.k]) out.pts[e.k]=r.rows[e.k].pts; }); }
      else { const r=calcHarvard(d); if(!r){ toast('Completa peso, sexo y pulsaciones'); break; } out.edad=num(d.edad); out.pulso=num(d.pulso); out.res={vo2tabla:r.vo2tabla,factor:r.factor,vo2aj:r.vo2aj,cat:r.cat}; }
      const tid=d._id||uid(); ui.modal=null; ui.d=null; put('tests',tid,out); render(true); toast('Test guardado'); break; }
    case 'savegtest': {
      const d=clone(ui.d); const r=calcG(d); if(!r||r.valor==null){ toast('Completa los datos del test'); break; }
      const out={cid:d.cid,tipo:d.tipo,fecha:d.fecha||ymd(new Date()),sexo:d.sexo||'',edad:num(d.edad),peso:num(d.peso),talla:num(d.talla),v:d.v,res:{valor:r.valor,unidad:r.unidad||'',dec:r.dec??1,cat:r.cat||null,cc:r.cc||'',lines:r.lines||[],dual:r.dual||null,tri:r.tri||null,ex:r.ex||null,nota:r.nota||''},modo:d.modo||'rapida'};
      const tid=d._id||uid(); ui.modal=null; ui.d=null;
      const c0=S.clientes[d.cid]; if(c0){ const c=clone(c0); let ch=false; if(!c.sexo&&d.sexo){c.sexo=d.sexo;ch=true;} if((c.edad===''||c.edad==null)&&num(d.edad)){c.edad=num(d.edad);ch=true;} if(num(d.talla)&&(d.tipo==='antropo'||c.talla===''||c.talla==null)&&c.talla!==num(d.talla)){c.talla=num(d.talla);ch=true;} if(d.tipo==='antropo'&&num(d.peso)){ const ln=lastBy(ofC('mediciones',d.cid)); if(!ln||ln.fecha<=out.fecha){ c.peso=num(d.peso); ch=true; } } if(ch) put('clientes',d.cid,c); }
      put('tests',tid,out); render(true); toast('Test guardado'); break; }
    case 'deltest': case 'deltest_ok': if(a==='deltest'){ ui.confirm='deltest:'+id; render(true); break; } ui.modal=null; ui.d=null; del('tests',id); render(true); break;
    /* macro */
    case 'mtplsave': { const nm=((document.getElementById('mtname')||{}).value||'').trim(); if(!nm) return toast('Ponle un nombre a la plantilla'); const mc=S.macros[id]; if(!mc) return; put('plantillas',uid(),{tipo:'macro',nombre:nm,meta:mc.meta||'',semanas:clone(mc.semanas)}); toast('Plantilla guardada'); break; }
    case 'mtplapply': { const p=S.plantillas[(document.getElementById('mtsel')||{}).value]; if(!p) return; const cur=S.macros[id]; put('macros',id,{cid:id,meta:p.meta||'',inicio:(cur&&cur.inicio)||ymd(new Date()),semanas:clone(p.semanas)}); toast('Plantilla aplicada'); break; }
    case 'maccopy': { const src=S.macros[(document.getElementById('mcsel')||{}).value]; if(!src) return; const cur=S.macros[id]; put('macros',id,{cid:id,meta:src.meta||'',inicio:(cur&&cur.inicio)||ymd(new Date()),semanas:clone(src.semanas)}); toast('Macrociclo copiado'); break; }
    case 'gmodo': ui.d.modo=v; render(true); break;
    case 'sethora': ui.d.hora=v; render(true); break;
    case 'gfull': guiaFull(v); break;
    case 'gfullx': { const o=document.getElementById('gfull'); if(o) o.remove(); break; }
    case 'macnew': put('macros',id,{cid:id,meta:MACRO_BASE.meta,inicio:ymd(new Date()),semanas:clone(MACRO_BASE.semanas)}); break;
    case 'delmac': case 'delmac_ok': if(a==='delmac'){ ui.confirm='delmac:'+id; render(); break; } ui.confirm=null; del('macros',id); break;
    /* hábitos */
    case 'hab': { const mid=id+'_'+ui.month; const d=clone(S.metas[mid]||{cid:id,mes:ui.month,habitos:HABITOS_BASE.slice(),obj:OBJ_MES_BASE.map(t=>({t,ok:null})),d:{}}); const k=el.dataset.h+'-'+el.dataset.day; const cur=d.d[k]; if(cur===undefined) d.d[k]=1; else if(cur===1) d.d[k]=0; else delete d.d[k]; put('metas',mid,d); break; }
    case 'addhab': { const inp=$('#newhab'); const t=inp&&inp.value.trim(); if(!t) break; const mid=id+'_'+ui.month; const d=clone(S.metas[mid]||{cid:id,mes:ui.month,habitos:HABITOS_BASE.slice(),obj:OBJ_MES_BASE.map(t=>({t,ok:null})),d:{}}); d.habitos.push(t); put('metas',mid,d); break; }
    case 'objm': { const mid=id+'_'+ui.month; const d=clone(S.metas[mid]||{cid:id,mes:ui.month,habitos:HABITOS_BASE.slice(),obj:OBJ_MES_BASE.map(t=>({t,ok:null})),d:{}}); const o=d.obj[+el.dataset.i]; const nv=v==='1'; o.ok=o.ok===nv?null:nv; put('metas',mid,d); break; }
    /* ajustes */
    case 'seed': seedAll(); break;
    case 'fbcfg': case 'fbcfgclr': case 'fbin': case 'fbup': case 'fbreset': case 'fbsync': case 'fbout': case 'fbrules': cloudAction(a,el); break;
    case 'exportf': exportFile(); break;
    case 'importf': { const f=document.getElementById('impf'); if(f) f.click(); break; }
    case 'backup': { const txt=backupText(); metaSet({lastBackup:Date.now()}); const done=()=>toast('Respaldo copiado'); try{ navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt)); }catch(err){ fallbackCopy(txt); } break; }
    case 'restore': { const t=$('#restore').value.trim(); if(!t){ toast('Pega primero el respaldo'); break; } try{ const o=JSON.parse(t); restoreAll(o); }catch(err){ toast('El texto no es un respaldo válido'); } break; }
    case 'wipe': case 'wipe_ok': if(a==='wipe'){ ui.confirm='wipe'; render(); break; } wipeAll(); break;
  }
});

function prompt2(){
  const d=ui.d; const exs=d.ejercicios.filter(e=>String(e.n||'').trim());
  if(!exs.length){ toast('Agrega ejercicios primero'); return; }
  const c=cli(d.cid); const id=uid();
  const nombre=(d.area||'Rutina')+' · '+(c?c.nombre:'')+' '+fdate(d.fecha);
  const p={nombre,area:d.area,ejercicios:clone(exs).map(e=>({...e,series:e.series.map(s=>({obj:s.reps!==''?String(s.reps):(s.obj||''),reps:'',lb:''}))}))};
  S.plantillas[id]=p; if(dbh) queue('plantillas/'+id,()=>dbh.collection('plantillas').doc(id).set(p)).catch(()=>toast('No se pudo guardar la plantilla')); else persistLocal();
  toast('Plantilla guardada: «'+nombre+'»');
}
function fallbackCopy(txt){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} ta.remove(); toast(ok?'Respaldo copiado':'No se pudo copiar: intenta de nuevo'); }
function seedAll(){
  const have=new Set(clientes().map(c=>(c.nombre||'').toLowerCase())); let n=0; let cristian=null;
  SEED_CLIENTES.forEach(s=>{
    if(have.has(s.nombre.toLowerCase())){ const ex=clientes().find(c=>c.nombre.toLowerCase()===s.nombre.toLowerCase()); if(s.nombre==='Cristian') cristian=ex.id; return; }
    const id=uid(); const c={nombre:s.nombre,edad:s.edad??'',sexo:s.sexo||'',peso:s.peso??'',objetivo:s.objetivo||'',dias:s.dias?s.dias.split(''):[],hora:s.hora||'',inicio:s.inicio||'',clases:s.clases??'',valor:s.valor??'',notas:'',activo:true};
    S.clientes[id]=c; if(dbh) queue('clientes/'+id,()=>dbh.collection('clientes').doc(id).set(c)); n++; if(s.nombre==='Cristian') cristian=id;
  });
  if(cristian && !ofC('mediciones',cristian).length){ const mid=uid(); const m={cid:cristian,fecha:'2025-06-11',peso:81.1,grasaPct:23.6,masaGrasa:19.1,masaMusc:35.4,visceral:null,brazo:null,muslo:null,cintura:null,cadera:null}; S.mediciones[mid]=m; if(dbh) queue('mediciones/'+mid,()=>dbh.collection('mediciones').doc(mid).set(m)); }
  if(!dbh) persistLocal(); render(); toast(n?n+' clientes cargados':'Ya estaban todos cargados');
}
function restoreAll(o){
  COLS.forEach(col=>{ const cur=Object.keys(S[col]); const nw=o[col]||{}; cur.forEach(id=>{ if(!(id in nw)) del2(col,id); }); Object.entries(nw).forEach(([id,v])=>{ S[col][id]=v; if(dbh) queue(col+'/'+id,()=>dbh.collection(col).doc(id).set(v)); }); });
  if(!dbh) persistLocal(); render(); toast('Respaldo restaurado');
}
function del2(col,id){ delete S[col][id]; if(dbh) queue(col+'/'+id,()=>dbh.collection(col).doc(id).delete()); }
function wipeAll(){ COLS.forEach(col=>Object.keys(S[col]).forEach(id=>del2(col,id))); if(!dbh) persistLocal(); ui.confirm=null; ui.cid=null; render(); toast('Datos borrados'); }

render();
initStore();
</script>
