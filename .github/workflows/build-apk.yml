name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Usar la llave de firma fija (para poder actualizar sin desinstalar)
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  debug {
                      storeFile file("$rootDir/../signing/debug.keystore")
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          EOF

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: entrenabilidad-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK como descarga directa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk entrenabilidad.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest entrenabilidad.apk --title "Entrenabilidad (APK)" --notes "APK de prueba. Descarga entrenabilidad.apk e instálalo en tu Android." --latest
